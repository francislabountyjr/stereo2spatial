seed: 1337
output_dir: runs/train_headphone_virtualizer

data:
  datasets:
    - dataset_root: dataset/stereo2spatial_headphone_virtualizer
      manifest_path: dataset/stereo2spatial_headphone_virtualizer/manifest.jsonl
  sample_artifact_mode: flac
  sample_exclusion_path:
  segment_seconds: 10.0
  sequence_seconds: 34.0
  stride_seconds: 8.0
  sample_rate: 48000
  training_sample_rate:
  mono_probability: 0.0
  downmix_probability: 0.0
  cache_size: 4
  materialize_cached_signals: true
  shuffle_segments_within_epoch: true
  shuffle_segments_within_song: true
  batch_mode: song_local
  batch_size: 4
  num_workers: 16
  prefetch_factor: 3
  pin_memory: true
  persistent_workers: false
  drop_last: true
  amplitude_lift_enabled: true
  amplitude_lift_mode: wavflow
  amplitude_lift_reference: source
  amplitude_lift_target_rms: 0.33
  amplitude_lift_scale: 3.0
  amplitude_lift_clip_value: null
  amplitude_lift_gain_power: 1.0
  amplitude_lift_gain_min_value: null
  amplitude_lift_waveform_clamp: true
  amplitude_lift_peak_limit: 4.0
  amplitude_lift_peak_rescale_min_rms: 0.00001
  amplitude_lift_output_lufs: -23.0
  amplitude_lift_eps: 1.0e-8
  min_source_rms: null
  source_resample_augmentation:
    enabled: true
    probability: 0.15
    rates: [44100]
  source_codec_augmentation:
    enabled: false
    probability: 0.20
    start_step: 50000
    full_strength_step: 150000
    backend: auto
    ffmpeg_path: ffmpeg
    max_chunk_seconds: 12.0
    align_max_lag: 8192
    timeout_seconds: 20.0
    codecs:
      mp3:
        weight: 0.40
        bitrates: [128, 160, 192, 256, 320]
      aac:
        weight: 0.35
        bitrates: [128, 160, 192, 256]
      opus:
        weight: 0.25
        bitrates: [96, 128, 160, 192]

model:
  architecture: waveform
  target_channels: 2
  cond_channels: 2
  patch_size: 200
  hidden_dim: 896
  num_layers: 12
  num_heads: 14
  mlp_ratio: 4.0
  dropout: 0.0
  timestep_embed_dim: 896
  timestep_scale: 1000.0
  max_period: 10000.0
  num_memory_tokens: 32
  mix_style_dim: 10
  amplitude_gain_conditioning: false
  waveform_level_depth: 0
  waveform_micro_patch_size: 8
  waveform_hidden_dim: 16
  waveform_num_heads: 8
  waveform_mlp_ratio: 2.0
  final_output_kernel_size: 7
  final_output_zero_init: true
  rope_enabled: true
  rope_theta: 10000.0
  activation_checkpointing: false

training:
  max_steps: 600000
  grad_accum_steps: 2
  mixed_precision: bf16
  compile_model: true
  compile_mode: max-autotune-no-cudagraphs
  resume_from_checkpoint: null
  init_from_checkpoint: null
  grad_clip_norm: 1.0
  log_every: 20
  checkpoint_every: 2500
  max_checkpoints_to_keep: 10
  num_epochs_hint: 1000
  window_seconds: 10.0
  overlap_seconds: 2.0
  tbptt_windows: 0
  sequence_seconds_choices: [10.0, 18.0, 26.0, 34.0]
  randomize_sequence_per_batch: true
  detach_memory: false
  use_gan: false
  routing_kl_weight: 0
  routing_kl_temperature: 1.1
  routing_kl_eps: 1.0e-6
  corr_weight: 0
  corr_eps: 1.0e-6
  corr_offdiag_only: true
  corr_use_correlation: true
  downmix_consistency_weight: 0.0
  downmix_consistency_loss: mse
  downmix_channel_order: [FL, FR]
  mix_style_dropout_probability: 0.20
  mrstft_loss_weight: 0.05
  mrstft_fft_sizes: [512, 1024, 2048]
  mrstft_hop_lengths: [128, 256, 512]
  mrstft_win_lengths: [512, 1024, 2048]
  mrstft_sc_weight: 1.0
  mrstft_log_mag_weight: 1.0
  mrstft_eps: 1.0e-7
  waveform_mse_loss_weight: 0.1
  waveform_l1_loss_weight: 0.0
  waveform_charbonnier_loss_weight: 0.9
  waveform_charbonnier_eps: 1.0e-3
  x_pred_v_loss_weight: 0.001
  perceptual_loss_weight: 0.03
  perceptual_n_fft: 1024
  perceptual_hop_length: 256
  perceptual_win_length: 1024
  perceptual_n_mels: 80
  perceptual_f_min: 40.0
  perceptual_f_max: null
  perceptual_band_weight: 1.25
  perceptual_band_low_hz: 150.0
  perceptual_band_high_hz: 8000.0
  perceptual_eps: 1.0e-5
  binaural_ild_loss_weight: 0.0
  binaural_ipd_loss_weight: 0.0
  binaural_ccf_loss_weight: 0.0
  binaural_frame_ild_loss_weight: 0.005
  binaural_frame_ild_frame_size: 2048
  binaural_frame_ild_hop_size: 1024
  binaural_frame_ild_silence_threshold: 1.0e-4
  binaural_frame_ild_max_weight: 4.0
  binaural_mid_side_loss_weight: 0.02
  binaural_mid_side_loss_type: charbonnier
  binaural_mid_side_mid_weight: 0.1
  binaural_mid_side_side_weight: 1.0
  binaural_mid_side_charbonnier_eps: 1.0e-3
  binaural_loss_warmup_steps: 40000
  binaural_loss_eps: 1.0e-7
  scheduled_sampling_max_step_offset: 0
  scheduled_sampling_probability: 0.0
  scheduled_sampling_prob_start: null
  scheduled_sampling_prob_end: null
  scheduled_sampling_ramp_steps: 0
  scheduled_sampling_start_step: 0
  scheduled_sampling_ramp_shape: linear
  scheduled_sampling_strategy: uniform
  scheduled_sampling_sampler: heun
  scheduled_sampling_reflexflow: null
  scheduled_sampling_reflexflow_alpha: 1.0
  scheduled_sampling_reflexflow_beta1: 10.0
  scheduled_sampling_reflexflow_beta2: 1.0
  flow_timestep_sampling: uniform
  flow_fast_schedule: false
  flow_logit_mean: 0.0
  flow_logit_std: 1.0
  flow_beta_alpha: 1.0
  flow_beta_beta: 1.0
  flow_custom_timesteps: null
  flow_schedule_shift: null
  flow_schedule_auto_shift: false
  flow_schedule_base_seq_len: 256
  flow_schedule_max_seq_len: 4096
  flow_schedule_base_shift: 0.5
  flow_schedule_max_shift: 1.15
  flow_loss_weighting: none
  flow_one_step: false
  flow_one_step_input: cond
  use_ema: true
  ema_decay: 0.999
  ema_device: accelerator
  ema_cpu_only: false
  run_validation: false
  validation_dataset_root: dataset/stereo2spatial_headphone_virtualizer
  validation_dataset_path: dataset/stereo2spatial_headphone_virtualizer/manifest.jsonl
  validation_steps: 5000
  run_validation_generations: true
  num_valid_generations: 1
  validation_generation_seed: 1337
  validation_generation_input_path: validation
  validation_generation_output_path: runs/train_headphone_virtualizer/validation_generations
  validation_generation_solver: res6s
  validation_generation_solver_steps: 4
  validation_generation_solver_rtol: 1.0e-5
  validation_generation_solver_atol: 1.0e-5
  validation_generation_chunk_seconds: 10.0
  validation_generation_overlap_seconds: 2.0

optimizer:
  type: muon
  lr: 1.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  adamw_fused: true
  adamw_foreach: false
  muon_ns_steps: 5
  muon_nesterov: true

scheduler:
  type: cosine
  warmup_steps: 40000
  min_lr: 1.0e-5
